<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica 1 - Despliegue de aplicaciones web</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <h1>Servidor DAW</h1>
        <p>Rafael Sánchez González – Práctica 1 DAW</p>
        <p>Fecha del navegador: <span id="fecha">No disponible</span></p>
        <p>PHP: no disponible en GitHub Pages</p>
        <p>Servidor: <span id="servidor">No disponible</span></p>
        <p>IP cliente: no disponible en esta página estática</p>
        <p>Protocolo: <span id="protocolo">No disponible</span></p>
        <script>
            document.getElementById('fecha').textContent = new Date().toLocaleString('es-ES');
            document.getElementById('servidor').textContent = window.location.hostname || 'Archivo local';
            document.getElementById('protocolo').textContent = window.location.protocol.replace(':', '').toUpperCase();
        </script>
    </body>
</html>
